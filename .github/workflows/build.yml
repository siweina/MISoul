name: Build

on:
  push:
    branches: [main, vip-unlock]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Show preinstalled SDK platforms
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MISOUL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MISOUL_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MISOUL_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MISOUL_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            printf 'storeFile=%s/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=PKCS12\n' "$GITHUB_WORKSPACE" "$STORE_PASSWORD" "${KEY_ALIAS:-misoul}" "$KEY_PASSWORD" > keystore.properties
          else
            echo "No release keystore secret, falling back to debug signing"
          fi
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MISoul-vip
          path: app/build/outputs/apk/release/app-release.apk
